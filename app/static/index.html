<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pelvic Floor Health Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div class="hero__badge">ML-03</div>
        <h1>Pelvic Floor Health Assistant</h1>
        <p>
          Answer a few questions to estimate your pelvic-floor dysfunction risk
          and receive a personalized Kegel training plan. Educational tool only —
          not a medical diagnosis.
        </p>
      </header>

      <main class="grid">
        <section class="card">
          <h2>Your assessment</h2>
          <form id="assessment-form" class="form">
            <div class="field">
              <label for="age">Age</label>
              <input type="number" id="age" name="age" min="18" max="90" value="42" required />
            </div>
            <div class="field">
              <label for="bmi">BMI</label>
              <input type="number" id="bmi" name="bmi" min="12" max="60" step="0.1" value="27.5" required />
            </div>
            <div class="field">
              <label for="num_pregnancies">Pregnancies</label>
              <input type="number" id="num_pregnancies" name="num_pregnancies" min="0" max="15" value="2" required />
            </div>
            <div class="field">
              <label for="vaginal_deliveries">Vaginal deliveries</label>
              <input type="number" id="vaginal_deliveries" name="vaginal_deliveries" min="0" max="15" value="2" required />
            </div>
            <div class="field">
              <label for="symptom_score">Symptom severity (0–10)</label>
              <input type="range" id="symptom_score" name="symptom_score" min="0" max="10" value="4" />
              <output id="symptom_score_out">4</output>
            </div>
            <div class="checks">
              <label class="check">
                <input type="checkbox" id="high_impact_activity" name="high_impact_activity" />
                <span>Regular high-impact activity</span>
              </label>
              <label class="check">
                <input type="checkbox" id="chronic_cough" name="chronic_cough" />
                <span>Chronic cough</span>
              </label>
              <label class="check">
                <input type="checkbox" id="constipation" name="constipation" checked />
                <span>Frequent straining / constipation</span>
              </label>
            </div>
            <button type="submit" class="btn" id="submit-btn">Estimate my risk</button>
          </form>
        </section>

        <section class="card result" id="result" aria-live="polite">
          <div class="result__empty" id="result-empty">
            <p>Your personalized results will appear here.</p>
          </div>
          <div class="result__content hidden" id="result-content">
            <div class="risk" id="risk-pill">
              <span class="risk__label" id="risk-label">—</span>
              <span class="risk__conf" id="risk-conf"></span>
            </div>
            <div class="bars" id="prob-bars"></div>
            <div class="plan" id="plan">
              <h3 id="plan-summary"></h3>
              <div class="plan__stats" id="plan-stats"></div>
              <ul class="plan__notes" id="plan-notes"></ul>
            </div>
          </div>
        </section>
      </main>
      <footer class="footer">
        <span id="model-status">Checking model…</span>
      </footer>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>

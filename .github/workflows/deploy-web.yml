# Stable public web preview of GitHub `main`.
# URL: https://labrosvel.github.io/ml-03-pelvic-floor-app/
#
# This is a convenience preview of the same Expo app (not a pivot away from mobile).
# Mobile EAS previews remain optional once EXPO_TOKEN is configured.
name: deploy-web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy main → GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export static web build
        env:
          BASE_PATH: /ml-03-pelvic-floor-app
        run: |
          echo "export const WEB_BUILD_ID = '${GITHUB_SHA::7}';" > constants/buildInfo.ts
          npx expo export -p web

      - name: Patch HTML cache headers
        run: bash scripts/patch-web-cache-headers.sh dist

      - name: Publish to gh-pages (preserve PR previews only)
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORK=/tmp/gh-pages-main
          rm -rf "$WORK"
          git clone --branch gh-pages --single-branch \
            "https://x-access-token:${GIT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$WORK"
          cd "$WORK"
          # Keep only PR preview folders; replace everything else with the new main build.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'pr-preview' -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/dist/." .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Deploy main web preview ${GITHUB_SHA}"
            git push origin gh-pages
          fi

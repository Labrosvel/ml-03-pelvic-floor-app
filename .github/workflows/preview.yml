# Publishes a mobile preview of each pull request via EAS Update.
# The action comments on the PR with a QR code / link for Expo Go (or a compatible build).
name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  update:
    name: EAS Update (PR preview)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Missing GitHub secret EXPO_TOKEN."
            echo "Create an Expo access token at https://expo.dev/settings/access-tokens"
            echo "Then add it as a repository secret named EXPO_TOKEN."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Create preview
        uses: expo/expo-github-action/preview@v8
        with:
          # Publishes this PR branch and comments a QR/link on the PR.
          command: eas update --auto --environment preview

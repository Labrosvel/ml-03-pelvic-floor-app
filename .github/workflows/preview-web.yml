# Per-PR web preview for UI validation before merge.
# URL pattern: https://labrosvel.github.io/ml-03-pelvic-floor-app/pr-preview/pr-<N>/
name: preview-web

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: pages-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy PR web preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        if: github.event.action != 'closed'
        uses: actions/checkout@v5

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Export static web build
        if: github.event.action != 'closed'
        env:
          BASE_PATH: /ml-03-pelvic-floor-app/pr-preview/pr-${{ github.event.number }}
        run: npx expo export -p web

      - name: Ensure dist exists
        run: mkdir -p dist

      - name: Deploy or clean PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist
          umbrella-dir: pr-preview

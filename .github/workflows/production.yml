# Publishes the stable "production" channel whenever main changes.
# Your mother (and anyone else) should always open the production channel link —
# not a Cloud Agent tunnel URL.
name: production

on:
  push:
    branches: [main]

jobs:
  update:
    name: EAS Update (production / main)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Missing GitHub secret EXPO_TOKEN."
            echo "Create an Expo access token at https://expo.dev/settings/access-tokens"
            echo "Then add it as a repository secret named EXPO_TOKEN."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish production update
        run: |
          eas update \
            --channel production \
            --environment production \
            --message "main@${GITHUB_SHA::7}" \
            --non-interactive
